# ============================================================================
# 容器 nginx：唯一对外端口 80
# ============================================================================
# ★ 2026-10-10 按【服务器实际配置】重写。原来这份是过期的：
#     旧版写 location /admin-ui/ 和 /api/ → digital-human:8126
#     实际（/etc/nginx/sites-available/portal）是 location /admin/ 和 /api/ → 网关 8090
#   路由写错会让管理台 404、所有 /api 请求打错后端，所以必须照实际来。
#
# 静态文件（由同步脚本从服务器原生目录拷入，不本地构建，避免 vite/esbuild 中文路径坑）：
#   /usr/share/nginx/html/portal/{portal.html,portal.css,portal.js}
#   /usr/share/nginx/html/admin/{index.html,assets/}
#
# 为保持与原生部署一致的路径语义，沿用它的 root 结构：
#   原生： root /var/www/portal  (location /)   + root /var/www (location /admin/)
#   容器： root /usr/share/nginx/html/portal (/) + root /usr/share/nginx/html (/admin/)
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/portal;
    # 2026-10-11：首页改为王瑞的项目展示页 tech.html（九章节滚动叙事），
    # portal.html 保留（业务门户，tech.html 内「业务门户」入口指向 /portal.html）
    index tech.html portal.html;

    # 知识库文档上传：内核侧 max-file-size=10MB / max-request-size=12MB，
    # 而 nginx 默认只收 1MB —— 原生配置里没写这条，>1MB 的上传会被 413 挡掉。
    # 这里补上，取 20m 给 multipart 边界留余量。
    client_max_body_size 20m;

    # ---- 静态资源传输优化（2026-10-11）：管理台单 JS 3.1MB，公网首屏被带宽卡死 ----
    # gzip 后 ~690KB；带 hash 的 /assets/** 长缓存，二次访问直接 304/本地命中
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 管理台公网入口（应用层 admin 登录保护）----
    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 业务门户 ----
    location / {
        try_files $uri $uri/ /portal.html;
        # 2026-10-12：门户静态资源禁止强缓存 —— 无 Cache-Control 时浏览器会按
        # (Date - Last-Modified) * 10% 做启发式缓存（约 1 小时），表现为
        #「前端修复已部署，但页面还是旧行为」（当晚实际踩到，白排查一轮）。
        # no-cache ≠ 不缓存：每次带 If-None-Match 条件请求，内容未变仍回 304（几乎不耗流量）。
        add_header Cache-Control "no-cache";
    }

    # ---- /api/** → 网关（不是内核！原生配置就是 8090）----
    location /api/ {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;      # SSE（小助手流式输出）必需
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 说明：原生还有一份 listen 127.0.0.1:8091 的 admin 站点（SSH 隧道备用入口）。
# 容器里不再提供 —— 它和上面 :80 的 /admin/ 功能重复，
# 且容器只 publish 80（多暴露一个端口就多一份风险）。
