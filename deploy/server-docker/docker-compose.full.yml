# ============================================================================
# 全量容器化 · 11 个服务（5 个中间件 + 5 个应用 + nginx）
# ============================================================================
# 与 docker-compose.apps.yml（阶段1）的区别：中间件也从原生 apt 迁到容器。
#
# 两条硬约束（都是 2026-10-10 真机实测得出的，别改）：
#   ① 中间件用【官方镜像】，不走自己的仓库 —— 只有 5 个应用镜像来自 ${REGISTRY}
#   ② 卷全部落在【服务器本地盘】 /opt/agent-platform/data/ 下（bind mount），
#      备份 = tar 这一个目录；想换命名卷的话把 volumes 那几行改成卷名即可
#
# ⚠️ 镜像 tag 按【真机版本】对齐（避免迁数据时踩跨大版本坑）：
#      MySQL 8.4.11 → mysql:8.4      PG 18.6+pgvector → pgvector/pgvector:pg18
#      Redis 8.0.5  → redis:8-alpine RabbitMQ 4.0.5 → rabbitmq:4-management-alpine
#      Nacos 3.2.4  → nacos/nacos-server:v3.2.4   （全部已用 docker manifest inspect 验证存在）
#
# ⚠️ 应用侧必须覆盖 5 处 jar 里写死的值（否则一定连不上）：
#      SPRING_DATASOURCE_URL / SPRING_DATA_REDIS_HOST / SPRING_RABBITMQ_HOST
#      NACOS_ADDR / SPRING_CLOUD_NACOS_DISCOVERY_IP
#    最后一条最阴：jar 里写死 ip: 127.0.0.1，容器里注册成 127.0.0.1 的话，
#    网关按服务名（lb://aismp-backend）根本找不到。这里用固定 IP 解决。
#
# ⚠️ 内存：mem_limit 之和 = 3488m，故意压在物理 3718m 之下。
#    全量容器化后总内存会比原生【高】约 300~500MB（dockerd+containerd 150~220
#    + 中间件容器化溢价），这是代价，不是 bug。
# ============================================================================
name: agent-platform

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [apnet]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  # ─────────────────────────── 中间件层（官方镜像） ───────────────────────────
  mysql:
    image: mysql:8.4
    container_name: ap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PW}
      # ★ 这两个必须传：init/mysql-init/01-init.sh 里要用它们建最小权限账号。
      #   官方 entrypoint 只认 MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER，
      #   不会替我们建"只授权两个库"的 api_user，所以脚本得自己拿到变量。
      MYSQL_APP_USER: ${MYSQL_APP_USER}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PW}
    volumes:
      - /opt/agent-platform/data/mysql:/var/lib/mysql
      - /opt/agent-platform/init/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max-connections=80
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PW}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [apnet]

  postgres:
    image: pgvector/pgvector:pg18
    container_name: ap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: ${PG_PW}
      POSTGRES_DB: terminal_kb
    volumes:
      # ★ postgres 18 改了 PGDATA 约定：18+ 镜像要求挂到 /var/lib/postgresql
      #   （数据落在版本化子目录 18/docker，便于 pg_upgrade --link）。
      #   挂到 /var/lib/postgresql/data 会被 entrypoint 判定为「无用挂载」并直接退出。
      - /opt/agent-platform/data/pg:/var/lib/postgresql
      - /opt/agent-platform/init/pg-init:/docker-entrypoint-initdb.d:ro
    command: ["-c", "shared_buffers=96MB", "-c", "max_connections=60"]
    mem_limit: 288m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d terminal_kb"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [apnet]

  redis:
    image: redis:8-alpine
    container_name: ap-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PW}", "--maxmemory", "64mb",
              "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - /opt/agent-platform/data/redis:/data
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PW}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [apnet]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ap-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PW}
    volumes:
      - /opt/agent-platform/data/rabbitmq:/var/lib/rabbitmq
    mem_limit: 224m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks: [apnet]

  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: ap-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 与真机一致：nacos.service 里是 -Dnacos.core.auth.enabled=false
      NACOS_AUTH_ENABLE: "false"
      # ★ 镜像的 entrypoint 会【无条件】检查这个变量，即使鉴权是关闭的也会因为缺失而 exit 255：
      #     "env NACOS_AUTH_TOKEN must be set with Base64 String."
      #   所以必须给（用凭据文件里生成好的那个，68 字符 Base64，解码 51 字节 ≥ 32）。
      NACOS_AUTH_TOKEN: ${NACOS_TOKEN_SECRET}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE}
      JVM_XMS: 128m
      JVM_XMX: 192m
      # ★ 镜像默认 JVM_XMN=512m，比我们设的 Xmx=192m 还大 —— 参数自相矛盾，
      #   不显式改小会导致 JVM 起不来。这也是看容器日志才发现的。
      JVM_XMN: 64m
      # 2026-10-10 调参：C1-only 编译，code cache 实测从 30MB 降到 10MB
      JVM_EXTRA_OPTS: "-XX:TieredStopAtLevel=1"
    volumes:
      - /opt/agent-platform/data/nacos:/home/nacos/data
      - /opt/agent-platform/data/nacos-logs:/home/nacos/logs
    # ★ 实测冷启动 585MB（调参后）/ 800MB（原参数）。给 448m 会直接 OOM-kill。
    mem_limit: 704m
    healthcheck:
      # ★ 2026-10-10 实测修正：原写 /nacos/actuator/health 在 standalone(server 模式) 下返回 404
      #   —— 那个端点是 native 的 deployment.type=merged（带 console）才有的。
      #   容器里实测可用且语义正确的是 naming 服务的 metrics 端点（返回 {"status":"UP"}）。
      #   逐路径实测结果：/nacos/ 200(但只是提示 console 端口) · /nacos/actuator/health 404
      #                  /nacos/v1|v3/console/health/* 全 404 · /nacos/v1/ns/operator/metrics 200 ✅
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q UP"]
      interval: 15s
      timeout: 8s
      retries: 15
    networks: [apnet]

  # ─────────────────────────── 应用层（来自自己的镜像仓库） ───────────────────────────
  gateway:
    <<: *app-defaults
    image: ${REGISTRY}/ap-gateway:${TAG}
    container_name: ap-gateway
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      NACOS_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.28.0.11
      REDIS_PW: ${REDIS_PW}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PW: ${RABBIT_PW}
      # 2026-10-10 容器化修复（另一位 agent）：网关到编排层的两条路由原本写死
      # http://localhost:8125（容器里 = 网关自己的回环 → /api/orchestrator/** 全 500），
      # yml 已改成 ${ORCHESTRATOR_URI:...} 占位符，这里注入容器内的服务名。
      ORCHESTRATOR_URI: http://orchestrator:8125
      JAVA_OPTS: "-Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    command: ["--server.port=8090"]
    mem_limit: 336m
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks:
      apnet: { ipv4_address: 172.28.0.11 }

  backend:
    <<: *app-defaults
    image: ${REGISTRY}/ap-backend:${TAG}
    container_name: ap-backend
    environment:
      # jar 里写死 jdbc:mysql://localhost:3306/api_db —— 必须覆盖
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/api_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      MYSQL_APP_USER: ${MYSQL_APP_USER}
      MYSQL_APP_PW: ${MYSQL_APP_PW}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      NACOS_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.28.0.12
      REDIS_PW: ${REDIS_PW}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PW: ${RABBIT_PW}
      GATEWAY_BASE_URL: http://gateway:8090
      # ★ 2026-10-10 补：backend 的 DigitalHumanAdminProxyController 读的是
      #   @Value("${aismp.digital-human.base-url:http://127.0.0.1:8126}")，
      #   对应 yml 里 `aismp.digital-human.base-url: ${DIGITAL_HUMAN_BASE_URL:...}`。
      #   之前漏设这个变量 → 回落到 127.0.0.1:8126 → 在容器里打自己的回环 → 管理端
      #   代理数字员工（/admin/digitalHuman/**）必然失败。
      DIGITAL_HUMAN_BASE_URL: http://digital-human:8126
      JAVA_OPTS: "-Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    command: ["--server.port=7529"]
    mem_limit: 384m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks:
      apnet: { ipv4_address: 172.28.0.12 }

  agent:
    <<: *app-defaults
    image: ${REGISTRY}/ap-agent:${TAG}
    container_name: ap-agent
    environment:
      # jar 里写死 jdbc:postgresql://127.0.0.1:5432/terminal_kb —— 必须覆盖
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/terminal_kb"
      PG_PASSWORD: ${PG_PW}
      NACOS_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.28.0.13
      MIMO_API_KEY: ${MIMO_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      JAVA_OPTS: "-Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    command: ["--server.port=8124"]
    mem_limit: 448m
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks:
      apnet: { ipv4_address: 172.28.0.13 }

  digital-human:
    <<: *app-defaults
    image: ${REGISTRY}/ap-digital-human:${TAG}
    container_name: ap-digital-human
    environment:
      # jar 里写死 jdbc:mysql://127.0.0.1:3306/terminal_db —— 必须覆盖
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/terminal_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NACOS_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.28.0.14
      GATEWAY_BASE_URL: http://gateway:8090
      GATEWAY_ACCESS_KEY: ${GW_ACCESS_KEY}
      GATEWAY_SECRET_KEY: ${GW_SECRET_KEY}
      BACKEND_BASE_URL: http://backend:7529
      AGENT_BASE_URL: http://agent:8124
      KB_UPLOAD_DIR: /app/kb-uploads
      MIMO_API_KEY: ${MIMO_API_KEY}
      JAVA_OPTS: "-Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    command: ["--server.port=8126"]
    volumes:
      - /opt/agent-platform/data/kb-uploads:/app/kb-uploads
    mem_limit: 384m
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
      gateway: { condition: service_started }
      backend: { condition: service_started }
      agent: { condition: service_started }
    networks:
      apnet: { ipv4_address: 172.28.0.14 }

  orchestrator:
    <<: *app-defaults
    # 2026-10-20：Python/LangGraph 版已换成 Java（Spring AI Alibaba Graph），镜像名沿用，compose 无需改名
    image: ${REGISTRY}/ap-orchestrator:${TAG}
    container_name: ap-orchestrator
    environment:
      # 配置项对应 aismp-orchestrator 的 OrchestratorProperties（orchestrator.*）
      LLM_API_KEY: ${MIMO_API_KEY}
      LLM_BASE_URL: https://api.xiaomimimo.com/v1
      LLM_MODEL: mimo-v2.6-flash
      # 容器里 127.0.0.1 是本容器回环，必须写服务名
      DIGITAL_HUMAN_DIRECT_URL: http://digital-human:8126
      # 补货/图表路线的取数源（aismp-agent）；容器里必须写服务名
      TERMINAL_BASE_URL: http://gateway:8090
      # 服务账号用于 /auth/login 换内核令牌（口令只从 .env 注入，不进仓库）
      ORCH_SVC_USER: svc_orchestrator
      ORCH_SVC_PASSWORD: ${ORCH_SVC_PASSWORD}
    # JVM 版内存边界：原 Python 版 192m（含 glibc arena 碎片），Java 不能沿用
    mem_limit: 384m
    depends_on:
      gateway: { condition: service_started }
      digital-human: { condition: service_started }
    networks:
      apnet: { ipv4_address: 172.28.0.15 }

  # ─────────────────────────── 唯一对外入口 ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ap-nginx
    restart: unless-stopped
    ports:
      # ★ 2026-10-10 外部实测纠正：当前唯一的公网入口是 **80**，不是 8000！
      #   实测：http://49.234.49.192/portal.html → HTTP 200；
      #         http://49.234.49.192:8000/portal.html → 连不上（ufw 只放行 22 + 80）。
      #   所以必须映射 80，否则 ① 门户公网入口挂掉 ② Docker 绕过 ufw 把 8000 变成公开。
      #   注意：Docker publish 的端口会**绕过 ufw**，所以容器侧只准映射这一个 80。
      - "80:80"
    volumes:
      - /opt/agent-platform/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/agent-platform/web/portal:/usr/share/nginx/html/portal:ro
      - /opt/agent-platform/web/admin:/usr/share/nginx/html/admin:ro
    mem_limit: 48m
    depends_on:
      gateway: { condition: service_started }
      digital-human: { condition: service_started }
    networks: [apnet]

networks:
  apnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
