<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>补货建议与调拨闭环流程图</title>
<style>
  body { margin: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #canvas { position: relative; width: 1360px; height: 2160px; background: #ffffff; }
  #arrows { position: absolute; left: 0; top: 0; z-index: 1; }
  .box { position: absolute; z-index: 2; display: flex; flex-direction: column; justify-content: center;
         align-items: center; text-align: center; font-size: 14px; line-height: 1.45; box-sizing: border-box; padding: 4px 10px; }
  .lbl { position: absolute; z-index: 3; font-size: 12px; color: #475569; background: rgba(255,255,255,.92);
         padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .term  { border-radius: 28px; border: 2px solid #2f9e63; background: #e8f7ee; color: #1b5e38; font-weight: 600; }
  .proc  { border-radius: 8px; border: 2px solid; }
  .err   { border-radius: 8px; border: 2px dashed #d9645f; background: #fdeeee; color: #a33c38; }
  .ai    { background: #f4f0ff; border-color: #7c5cf0; color: #4c2fb8; }
  .biz   { background: #e9f3ff; border-color: #2f7fd1; color: #1c5fae; }
  .end   { background: #e8f7ee; border-color: #2f9e63; color: #1b5e38; }
  .dtext { position: absolute; z-index: 3; text-align: center; font-size: 13px; font-weight: 600; color: #8a6106; }
  #title { position: absolute; top: 22px; left: 0; width: 100%; text-align: center; font-size: 26px; font-weight: 700; color: #1e293b; z-index: 2; }
  #subtitle { position: absolute; top: 60px; left: 0; width: 100%; text-align: center; font-size: 13px; color: #64748b; z-index: 2; }
  .tokbox { position: absolute; z-index: 2; border: 2px dashed #7c5cf0; border-radius: 10px; background: #fbfaff; }
  .toktitle { position: absolute; z-index: 3; width: 100%; text-align: center; font-size: 13px; font-weight: 700; color: #4c2fb8; line-height: 1.4; }
  .mini { position: absolute; z-index: 2; border: 1.5px solid #b9a5f5; background: #f4f0ff; color: #4c2fb8;
          border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; padding: 2px 6px; }
  #legend { position: absolute; z-index: 2; left: 260px; top: 2050px; width: 840px; display: flex; gap: 26px; align-items: center; }
  .li { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #475569; }
  .s-term { width: 34px; height: 18px; border-radius: 9px; border: 2px solid #2f9e63; background: #e8f7ee; }
  .s-ai   { width: 30px; height: 18px; border: 2px solid #7c5cf0; background: #f4f0ff; border-radius: 4px; }
  .s-biz  { width: 30px; height: 18px; border: 2px solid #2f7fd1; background: #e9f3ff; border-radius: 4px; }
  .s-judge{ width: 22px; height: 22px; transform: rotate(45deg) scale(.82); border: 2px solid #e6a817; background: #fff8e0; }
  .s-data { width: 30px; height: 18px; border: 2px solid #1fa394; background: #e3f7f5; border-radius: 2px; transform: skewX(-14deg); }
  .s-warn { width: 30px; height: 18px; border: 2px dashed #d9645f; background: #fdeeee; border-radius: 4px; }
  .s-tok  { width: 30px; height: 18px; border: 2px dashed #7c5cf0; background: #fbfaff; border-radius: 4px; }
</style>
</head>
<body>
<div id="canvas">
  <svg id="arrows" width="1360" height="2160" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
      </marker>
    </defs>
    <g id="paths" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></g>
    <g id="shapes"></g>
  </svg>
  <div id="title">终端 AI 智慧管理平台 · 补货建议与调拨闭环流程图</div>
  <div id="subtitle">意图识别 → 补货建议工作流（确定性算法）→ 调拨闭环执行 ｜ 账管确认 · 双仓管校验 · 全程留痕可回溯</div>
  <div id="legend">
    <div class="li"><span class="s-term"></span>开始 / 结束</div>
    <div class="li"><span class="s-ai"></span>AI 编排节点</div>
    <div class="li"><span class="s-biz"></span>业务执行节点</div>
    <div class="li"><span class="s-judge"></span>判断分支</div>
    <div class="li"><span class="s-data"></span>数据输出</div>
    <div class="li"><span class="s-warn"></span>异常处理</div>
    <div class="li"><span class="s-tok"></span>Token 计量旁路</div>
  </div>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const canvas = document.getElementById("canvas");
const gPath = document.getElementById("paths");
const gShape = document.getElementById("shapes");

function addBox(x, y, w, h, cls, lines) {
  const d = document.createElement("div");
  d.className = "box " + cls;
  d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px"; d.style.height = h + "px";
  lines.forEach(t => { const p = document.createElement("div"); p.textContent = t; d.appendChild(p); });
  canvas.appendChild(d);
}
function addDiamond(cx, cy, w, h, text) {
  const poly = document.createElementNS(NS, "polygon");
  poly.setAttribute("points", `${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}`);
  poly.setAttribute("fill", "#fff8e0"); poly.setAttribute("stroke", "#e6a817"); poly.setAttribute("stroke-width", "2");
  gShape.appendChild(poly);
  const d = document.createElement("div");
  d.className = "dtext";
  d.style.left = (cx - w * 0.30) + "px"; d.style.top = (cy - h * 0.18) + "px";
  d.style.width = (w * 0.60) + "px"; d.style.height = (h * 0.36) + "px";
  d.textContent = text;
  canvas.appendChild(d);
}
function addPara(x, y, w, h, lines) {
  const poly = document.createElementNS(NS, "polygon");
  poly.setAttribute("points", `${x+22},${y} ${x+w},${y} ${x+w-22},${y+h} ${x},${y+h}`);
  poly.setAttribute("fill", "#e3f7f5"); poly.setAttribute("stroke", "#1fa394"); poly.setAttribute("stroke-width", "2");
  gShape.appendChild(poly);
  const d = document.createElement("div");
  d.className = "box"; d.style.color = "#0d6b60"; d.style.fontWeight = "600";
  d.style.left = (x+22) + "px"; d.style.top = y + "px"; d.style.width = (w-44) + "px"; d.style.height = h + "px";
  lines.forEach(t => { const p = document.createElement("div"); p.textContent = t; d.appendChild(p); });
  canvas.appendChild(d);
}
function arrow(points) {
  const p = document.createElementNS(NS, "polyline");
  p.setAttribute("points", points.map(q => q.join(",")).join(" "));
  gPath.appendChild(p);
}
function label(x, y, text) {
  const d = document.createElement("div");
  d.className = "lbl"; d.style.left = x + "px"; d.style.top = y + "px"; d.textContent = text;
  canvas.appendChild(d);
}

/* ── 节点 ── */
addBox(310, 90, 240, 56, "term end", ["用户输入问题 / 需求"]);
addBox(290, 190, 280, 60, "proc ai", ["意图识别（AI 智能路由）"]);
addDiamond(430, 360, 230, 120, "问题类型？");
addBox(760, 328, 300, 64, "proc ai", ["知识库检索问答", "（操作手册 / FAQ）"]);
addBox(810, 440, 200, 52, "term end", ["返回回答"]);
addBox(270, 480, 320, 64, "proc ai", ["取数节点：查询库存", "仓位 / 状态 / 型号 / 库龄 / 在途"]);
addBox(270, 590, 320, 76, "proc ai", ["确定性算法（不经大模型）", "周使用量 = 近3月日均 × 7", "缺口 = 预测需求 −（可用 + 在途）"]);
addDiamond(430, 765, 250, 120, "存在可调拨库存？");
addBox(760, 733, 300, 64, "proc ai", ["生成调拨清单", "库存充足仓位 / 型号 / 建议调拨数量"]);
addDiamond(910, 890, 200, 110, "缺口已全部解决？");
addBox(280, 945, 300, 64, "proc ai", ["生成采购清单", "建议品牌 / 数量 / 补货优先级"]);
addPara(260, 1065, 340, 60, ["对话流输出清单卡片（可导出 Excel）"]);
addBox(270, 1185, 320, 64, "proc biz", ["账管员确认", "创建调拨单"]);
addBox(260, 1295, 340, 76, "proc biz", ["推送调出方库管", "上传串码 Excel 出库", "校验：型号 / 数量 / 状态 = 可用"]);
addDiamond(430, 1480, 230, 110, "校验通过？");
addBox(760, 1452, 280, 56, "err", ["提示错误，重新导入串码"]);
addBox(260, 1585, 340, 64, "proc biz", ["推送调入方库管", "核对确认入库"]);
addDiamond(430, 1750, 230, 110, "是否接受？");
addBox(760, 1722, 280, 56, "err", ["通知发起方，调整清单后重新发起"]);
addBox(260, 1855, 340, 64, "proc biz", ["库存变更（出库扣减 / 入库增加）", "调拨完成，库内可查"]);
addBox(330, 1965, 200, 52, "term end", ["结束"]);

/* ── 连线 ── */
arrow([[430,146],[430,190]]);                                             // 开始→意图
arrow([[430,250],[430,300]]);                                             // 意图→问题类型
arrow([[545,360],[760,360]]); label(585,340,"知识库问答"); // →知识库
arrow([[910,374],[910,440]]);                                             // 知识库→回答
arrow([[430,420],[430,480]]); label(442,438,"补货 / 库存操作");             // →取数
arrow([[430,544],[430,590]]);                                             // 取数→算法
arrow([[430,666],[430,705]]);                                             // 算法→可调拨?
arrow([[555,765],[760,765]]); label(590,748,"是");     // →调拨清单
arrow([[910,784],[910,835]]);                                             // 调拨清单→全解决?
arrow([[430,825],[430,945]]); label(440,878,"否");                         // →采购清单
arrow([[910,945],[910,977],[580,977]]); label(700,958,"否（部分解决）");    // 全解决?否→采购清单
arrow([[810,890],[660,890],[660,1035],[430,1035],[430,1065]]); label(560,872,"是（调拨已满足）"); // 全解决?是→输出
arrow([[430,1009],[430,1065]]);                                           // 采购清单→输出
arrow([[430,1125],[430,1185]]);                                           // 输出→建单
arrow([[430,1249],[430,1295]]);                                           // 建单→出库
arrow([[430,1371],[430,1425]]);                                           // 出库→校验?
arrow([[545,1480],[760,1480]]); label(620,1460,"否");                      // 校验?否→重传
arrow([[900,1452],[900,1333],[600,1333]]);                                // 重传→出库
arrow([[430,1535],[430,1585]]); label(440,1552,"是");                      // 校验?是→入库
arrow([[430,1649],[430,1695]]);                                           // 入库→接受?
arrow([[545,1750],[760,1750]]); label(612,1730,"拒绝");                    // 接受?拒绝→通知
arrow([[1040,1750],[1120,1750],[1120,1217],[590,1217]]); label(650,1196,"调整后重新发起"); // 通知→建单
arrow([[430,1805],[430,1855]]); label(440,1822,"同意");                    // 接受?同意→库存变更
arrow([[430,1919],[430,1965]]);                                           // →结束

/* ── Token 计量旁路 ── */
const tk = document.createElement("div");
tk.className = "tokbox"; tk.style.left = "20px"; tk.style.top = "480px"; tk.style.width = "220px"; tk.style.height = "400px";
canvas.appendChild(tk);
const tt = document.createElement("div");
tt.className = "toktitle"; tt.style.left = "20px"; tt.style.top = "494px"; tt.style.width = "220px";
tt.innerHTML = "全链路 Token 计量与限额<br>（贯穿所有 AI 节点）";
canvas.appendChild(tt);
addBox(40, 560, 180, 50, "mini", ["Token 采集（双端 usage）"]);
addBox(40, 680, 180, 50, "mini", ["账本聚合（按人 / 天 / 功能）"]);
addBox(40, 800, 180, 50, "mini", ["日限额校验（超额停用 · 次日恢复）"]);
arrow([[130,610],[130,680]]);
arrow([[130,730],[130,800]]);
const dash = document.createElementNS(NS, "polyline");
dash.setAttribute("points", "240,628 270,628");
dash.setAttribute("stroke-dasharray", "5,4"); dash.setAttribute("stroke", "#7c5cf0"); dash.setAttribute("marker-end", "url(#ah)");
gPath.appendChild(dash);
</script>
</body>
</html>
