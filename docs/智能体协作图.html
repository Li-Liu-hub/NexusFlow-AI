<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能体协作图</title>
<style>
  body { margin: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #canvas { position: relative; width: 1935px; height: 1057px; background: #ffffff; overflow: hidden; }
  #arrows { position: absolute; left: 0; top: 0; z-index: 1; }
  .box { position: absolute; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center;
         text-align: center; box-sizing: border-box; padding: 4px 7px; }
  .lbl { position: absolute; z-index: 3; font-size: 11.5px; color: #475569; background: rgba(255,255,255,.94);
         padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .flbl { position: absolute; z-index: 3; font-size: 11.5px; color: #0d6b60; background: rgba(255,255,255,.9);
          padding: 0 4px; white-space: nowrap; }
  #title { position: absolute; top: 18px; left: 0; width: 100%; text-align: center; font-size: 26px; font-weight: 700; color: #1e293b; z-index: 2; }
  #subtitle { position: absolute; top: 56px; left: 0; width: 100%; text-align: center; font-size: 13px; color: #64748b; z-index: 2; }
  .ai  { border: 2px solid #7c5cf0; background: #f4f0ff; color: #4c2fb8; border-radius: 8px; font-size: 11.5px; line-height: 1.5; }
  .code{ border: 2px solid #94a3b8; background: #f1f5f9; color: #334155; border-radius: 8px; font-size: 11.5px; line-height: 1.5; }
  .res { border: 2px solid #2f9e63; background: #e8f7ee; color: #1b5e38; border-radius: 10px; font-size: 11.5px; line-height: 1.5; }
  .term{ border: 2px solid #2f9e63; background: #e8f7ee; color: #1b5e38; border-radius: 26px; font-weight: 600; font-size: 14px; }
  .conf{ border: 2px dashed #ef8b2f; background: #fff4e5; color: #9a5410; border-radius: 8px;
         display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; text-align: center; }
  .tok { border: 2px solid #b9a5f5; background: #f4f0ff; color: #4c2fb8; border-radius: 6px;
         display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11.5px; line-height: 1.35; }
  .bt { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .bl { font-weight: 700; }
  #legend { position: absolute; z-index: 2; left: 240px; top: 1002px; width: 1120px; font-size: 12px; color: #475569; }
</style>
</head>
<body>
<div id="canvas">
  <svg id="arrows" width="1935" height="1057" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
      </marker>
      <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c5cf0"/>
      </marker>
      <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9645f"/>
      </marker>
    </defs>
    <g id="paths" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></g>
  </svg>
  <div id="title"></div>
  <div id="subtitle"></div>
  <div id="legend"></div>
</div>
<script>
const DATA = {"W": 1935, "H": 1057, "title": "终端 AI 智慧管理平台 · Agent 工作流编排与多智能体协作图", "subtitle": "", "legend": "图例：紫框 = LLM 节点 / 智能体（⚡ = Token 埋点）　｜　灰框 = 确定性代码（非 LLM）　｜　绿框 = 响应 / 起止　｜　橙虚框 = 人工确认　｜　实线 = 主流程 · State 字段交接　｜　红虚线 = 回炉（按失败类型）　｜　紫虚线 = LLM 调用 / Token 上报", "verts": [{"id": "start", "x": 10.0, "y": 485.0, "w": 120.0, "h": 50.0, "cls": "term", "lines": ["用户输入"], "bold": [false]}, {"id": "supervise", "x": 190.0, "y": 460.0, "w": 210.0, "h": 100.0, "cls": "ai", "lines": ["⚡ supervise 路由节点", "1 次 LLM 结构化分类", "知识库问答 / 补货建议 / 建单", "异常兜底 → 知识库问答"], "bold": [true, false, false, false]}, {"id": "rag", "x": 515.0, "y": 150.0, "w": 210.0, "h": 130.0, "cls": "ai", "lines": ["⚡ rag_node 知识库问答", "1 次检索增强生成", "经网关调 Java", "/oa/chat/sync", "复用五轮迭代 RAG 管线", "输出：agent_response（回答文本）"], "bold": [true, false, false, false, false, true]}, {"id": "fetch", "x": 530.0, "y": 430.0, "w": 190.0, "h": 170.0, "cls": "ai", "lines": ["⚡⚡ fetch 取数智能体", "工具调用循环 ≤3 轮", "查库存聚合 · 库龄 · 在途", "全部经网关签名调用", "输入：query（用户问题）", "输出：inventory_snapshot（库存快照）"], "bold": [true, false, false, false, true, true]}, {"id": "algorithm", "x": 860.0, "y": 430.0, "w": 220.0, "h": 170.0, "cls": "ai", "lines": ["⚡⚡ algorithm 算法智能体", "工具箱（确定性代码函数）：", "缺口分析 · 水位线计算", "调拨可行性 · 品牌评分 · 需求预测", "自主决策：跑哪几种 · 传什么参数", "输出：algo_result（算法结果）+ strategy（分流策略）", "（仅调拨 / 仅采购 / 混合）"], "bold": [true, false, false, false, false, true, false]}, {"id": "report", "x": 1210.0, "y": 430.0, "w": 190.0, "h": 170.0, "cls": "ai", "lines": ["⚡⚡ 报表生成智能体", "装配卡片（代码工具）", "数字自检 verify_numbers", "总结句（数字槽位预填）", "失败 → 模板句降级", "输入：algo_result（算法结果）", "输出：cards（卡片载荷）+ suggestion_id（建议编号）"], "bold": [true, false, false, false, false, true, true]}, {"id": "order", "x": 520.0, "y": 750.0, "w": 200.0, "h": 120.0, "cls": "ai", "lines": ["⚡⚡ order 建单智能体", "工具调用循环 ≤3 轮", "入口①：一句话直接建单", "入口②：确认建议后建单", "建单前重校验库存", "输出：调拨单卡片"], "bold": [true, false, false, false, false, true]}, {"id": "critic", "x": 1500.0, "y": 430.0, "w": 190.0, "h": 170.0, "cls": "ai", "lines": ["⚡ critic 质检 · 双闸门", "① 代码 diff 数字一致性", "② LLM 语义合理性", "输入：cards（卡片载荷）/ order_info（建单结果）", "输入：agent_response（回答文本）", "回炉 ≤2 轮 · 否则降级放行"], "bold": [true, false, false, false, false, false]}, {"id": "respond", "x": 1770.0, "y": 445.0, "w": 135.0, "h": 140.0, "cls": "res", "lines": ["respond", "SSE result", "agent_response", "+ 卡片载荷", "Token 汇总上报", "限额预检不过", "→ 额度用尽卡"], "bold": [true, false, false, false, false, false, false]}, {"id": "confirm", "x": 1210.0, "y": 680.0, "w": 220.0, "h": 48.0, "cls": "conf", "lines": ["★ 人工确认 ★　点「申请调拨」/ 说「帮我调拨」"], "bold": [true]}, {"id": "tok1", "x": 60.0, "y": 905.0, "w": 210.0, "h": 52.0, "cls": "tok", "lines": ["⚡ LLM 节点采集 usage"], "bold": [false]}, {"id": "tok2", "x": 300.0, "y": 905.0, "w": 210.0, "h": 52.0, "cls": "tok", "lines": ["meta 汇总（reducer 合并）"], "bold": [false]}, {"id": "tok3", "x": 540.0, "y": 905.0, "w": 210.0, "h": 52.0, "cls": "tok", "lines": ["respond 上报（result.meta）"], "bold": [false]}, {"id": "tok4", "x": 780.0, "y": 905.0, "w": 210.0, "h": 52.0, "cls": "tok", "lines": ["网关计量装饰器"], "bold": [false]}, {"id": "tok5", "x": 1020.0, "y": 905.0, "w": 210.0, "h": 52.0, "cls": "tok", "lines": ["RabbitMQ → backend 账本"], "bold": [false]}, {"id": "tok6", "x": 1260.0, "y": 905.0, "w": 210.0, "h": 52.0, "cls": "tok", "lines": ["限额预检（超额停用 · 次日恢复）"], "bold": [false]}], "edges": [{"poly": [[130.0, 510.0], [190.0, 510.0]], "kind": "main", "lbl": null}, {"poly": [[400.0, 500.0], [400.0, 215.0], [515.0, 215.0]], "kind": "main", "lbl": {"x": 385.0, "y": 286.0, "text": "知识库问答", "kind": "lbl"}}, {"poly": [[400.0, 510.0], [530.0, 510.0]], "kind": "main", "lbl": {"x": 453.0, "y": 496.0, "text": "补货建议", "kind": "lbl"}}, {"poly": [[400.0, 540.0], [400.0, 810.0], [520.0, 810.0]], "kind": "main", "lbl": {"x": 385.0, "y": 721.0, "text": "一句话建单", "kind": "lbl"}}, {"poly": [[725.0, 215.0], [1590.0, 215.0], [1590.1, 430.0]], "kind": "main", "lbl": {"x": 1253.0, "y": 201.0, "text": "回答文本", "kind": "lbl"}}, {"poly": [[720.0, 515.0], [860.0, 515.0]], "kind": "main", "lbl": {"x": 778.0, "y": 501.0, "text": "库存快照", "kind": "lbl"}}, {"poly": [[1080.0, 515.0], [1210.0, 515.0]], "kind": "main", "lbl": {"x": 1133.0, "y": 501.0, "text": "算法结果", "kind": "lbl"}}, {"poly": [[1400.0, 515.0], [1500.0, 515.0]], "kind": "main", "lbl": {"x": 1438.0, "y": 501.0, "text": "卡片载荷", "kind": "lbl"}}, {"poly": [[1690.0, 515.0], [1770.0, 515.0]], "kind": "main", "lbl": {"x": 1724.0, "y": 501.0, "text": "合格", "kind": "lbl"}}, {"poly": [[720.0, 810.0], [1590.4, 810.0], [1590.4, 603.1]], "kind": "main", "lbl": {"x": 1222.7, "y": 796.0, "text": "建单结果 + 调拨单卡片", "kind": "lbl"}}, {"poly": [[1557.0, 600.0], [1550.0, 390.0], [1427.5, 390.0], [1305.0, 389.8], [1320.2, 600.0]], "kind": "rework", "lbl": {"x": 1364.2, "y": 376.0, "text": "① 数字不一致 → 重新装卡片（≤2 轮）", "kind": "lbl"}}, {"poly": [[1547.5, 430.0], [1547.5, 370.0], [625.0, 370.0], [625.0, 430.0]], "kind": "rework", "lbl": {"x": 1032.2, "y": 356.0, "text": "② 取数不全 / 语义不符 → 补查", "kind": "lbl"}}, {"poly": [[1320.0, 600.0], [1320.0, 680.0]], "kind": "main", "lbl": {"x": 1287.0, "y": 626.0, "text": "建议卡片 + 建议编号", "kind": "lbl"}}, {"poly": [[1210.0, 704.0], [620.0, 704.0], [620.0, 750.0]], "kind": "main", "lbl": {"x": 841.0, "y": 690.0, "text": "携带建议编号 · 建单前重校验库存", "kind": "lbl"}}, {"poly": [[1837.5, 585.0], [1840.0, 585.0], [1840.0, 931.0], [1470.0, 931.0]], "kind": "llm", "lbl": null}, {"poly": [[270.0, 931.0], [300.0, 931.0]], "kind": "main", "lbl": null}, {"poly": [[510.0, 931.0], [540.0, 931.0]], "kind": "main", "lbl": null}, {"poly": [[750.0, 931.0], [780.0, 931.0]], "kind": "main", "lbl": null}, {"poly": [[990.0, 931.0], [1020.0, 931.0]], "kind": "main", "lbl": null}, {"poly": [[1230.0, 931.0], [1260.0, 931.0]], "kind": "main", "lbl": null}]};
document.getElementById("title").textContent = DATA.title;
document.getElementById("subtitle").textContent = DATA.subtitle;
document.getElementById("legend").textContent = DATA.legend;

const NS = "http://www.w3.org/2000/svg";
const canvas = document.getElementById("canvas");
const gPath = document.getElementById("paths");
const CLS = { term: "term", conf: "conf", tok: "tok", res: "res", code: "code", ai: "ai" };

DATA.verts.forEach(v => {
  const d = document.createElement("div");
  d.className = "box " + (CLS[v.cls] || "ai");
  d.style.left = v.x + "px"; d.style.top = v.y + "px"; d.style.width = v.w + "px"; d.style.height = v.h + "px";
  v.lines.forEach((ln, i) => {
    const p = document.createElement("div");
    if (i === 0) { p.className = "bt"; } else if (v.bold[i]) { p.className = "bl"; }
    p.textContent = ln;
    d.appendChild(p);
  });
  canvas.appendChild(d);
});

DATA.edges.forEach(e => {
  const p = document.createElementNS(NS, "polyline");
  p.setAttribute("points", e.poly.map(q => q.join(",")).join(" "));
  if (e.kind === "rework") { p.setAttribute("stroke", "#d9645f"); p.setAttribute("stroke-dasharray", "6,4"); p.setAttribute("marker-end", "url(#ahr)"); }
  if (e.kind === "llm") { p.setAttribute("stroke", "#7c5cf0"); p.setAttribute("stroke-dasharray", "6,4"); p.setAttribute("marker-end", "url(#ahp)"); }
  gPath.appendChild(p);
  if (e.lbl) {
    const d = document.createElement("div");
    d.className = e.lbl.kind; d.style.left = e.lbl.x + "px"; d.style.top = e.lbl.y + "px"; d.textContent = e.lbl.text;
    canvas.appendChild(d);
  }
});
</script>
</body>
</html>
