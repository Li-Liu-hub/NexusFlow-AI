<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>项目架构图</title>
<style>
  body { margin: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #canvas { position: relative; width: 1540px; height: 1030px; background: #ffffff; overflow: hidden; }
  #arrows { position: absolute; left: 0; top: 0; z-index: 1; }
  .box { position: absolute; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center;
         text-align: center; box-sizing: border-box; padding: 5px 12px; }
  .lbl { position: absolute; z-index: 3; font-size: 12px; color: #475569; background: rgba(255,255,255,.94);
         padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .band { position: absolute; z-index: 1; font-size: 13px; font-weight: 700; color: #94a3b8; letter-spacing: 2px; }
  #title { position: absolute; top: 18px; left: 0; width: 100%; text-align: center; font-size: 26px; font-weight: 700; color: #1e293b; z-index: 2; }
  #subtitle { position: absolute; top: 56px; left: 0; width: 100%; text-align: center; font-size: 13px; color: #64748b; z-index: 2; }
  .fe    { border: 2px solid #1fa394; background: #e3f7f5; color: #0d6b60; border-radius: 8px; }
  .ai    { border: 2px solid #7c5cf0; background: #f4f0ff; color: #4c2fb8; border-radius: 8px; }
  .biz   { border: 2px solid #2f7fd1; background: #e9f3ff; color: #1c5fae; border-radius: 8px; }
  .mw    { border: 2px solid #94a3b8; background: #f1f5f9; color: #334155; border-radius: 8px; }
  .ext   { border: 2px dashed #ef8b2f; background: #fff4e5; color: #9a5410; border-radius: 8px; }
  .user  { border: 2px solid #2f9e63; background: #e8f7ee; color: #1b5e38; border-radius: 26px; font-weight: 600; }
  .bt  { font-size: 15px; font-weight: 700; }
  .bd  { font-size: 12px; line-height: 1.5; margin-top: 3px; }
  .bd2 { font-size: 11.5px; line-height: 1.5; opacity: .85; }
  #legend { position: absolute; z-index: 2; left: 240px; top: 975px; width: 1100px; display: flex; gap: 24px; align-items: center; }
  .li { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #475569; }
  .s-fe { width: 30px; height: 18px; border: 2px solid #1fa394; background: #e3f7f5; border-radius: 4px; }
  .s-ai { width: 30px; height: 18px; border: 2px solid #7c5cf0; background: #f4f0ff; border-radius: 4px; }
  .s-biz{ width: 30px; height: 18px; border: 2px solid #2f7fd1; background: #e9f3ff; border-radius: 4px; }
  .s-mw { width: 30px; height: 18px; border: 2px solid #94a3b8; background: #f1f5f9; border-radius: 4px; }
  .s-ext{ width: 30px; height: 18px; border: 2px dashed #ef8b2f; background: #fff4e5; border-radius: 4px; }
  .s-line { width: 30px; height: 0; border-top: 2px solid #64748b; }
  .s-dash { width: 30px; height: 0; border-top: 2px dashed #7c5cf0; }
</style>
</head>
<body>
<div id="canvas">
  <svg id="arrows" width="1540" height="1030" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
      </marker>
      <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c5cf0"/>
      </marker>
    </defs>
    <g id="paths" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"></g>
  </svg>
  <div id="title">终端 AI 智慧管理平台 · 项目架构图</div>
  <div id="subtitle">统一网关治理（鉴权 · 限流 · Token 计量）｜ LangGraph 编排层 + Spring AI 智能体 + 管理后端 ｜ 数字不经大模型，查库 + 固定算法</div>

  <div class="band" style="left:20px; top:118px;">用户层</div>
  <div class="band" style="left:20px; top:232px;">前端层</div>
  <div class="band" style="left:20px; top:368px;">接入层</div>
  <div class="band" style="left:20px; top:555px;">服务层</div>
  <div class="band" style="left:20px; top:762px;">中间件</div>
  <div class="band" style="left:20px; top:882px;">外部</div>

  <div id="legend">
    <div class="li"><span class="s-fe"></span>前端</div>
    <div class="li"><span class="s-ai"></span>AI 能力服务</div>
    <div class="li"><span class="s-biz"></span>Java 服务</div>
    <div class="li"><span class="s-mw"></span>中间件</div>
    <div class="li"><span class="s-ext"></span>外部 LLM</div>
    <div class="li"><span class="s-line"></span>同步调用 / 数据读写</div>
    <div class="li"><span class="s-dash"></span>LLM 调用</div>
  </div>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const canvas = document.getElementById("canvas");
const gPath = document.getElementById("paths");

function addBox(x, y, w, h, cls, html) {
  const d = document.createElement("div");
  d.className = "box " + cls;
  d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px"; d.style.height = h + "px";
  d.innerHTML = html;
  canvas.appendChild(d);
}
function arrow(points, dashed, purple) {
  const p = document.createElementNS(NS, "polyline");
  p.setAttribute("points", points.map(q => q.join(",")).join(" "));
  if (dashed) { p.setAttribute("stroke-dasharray", "6,4"); }
  if (purple) { p.setAttribute("stroke", "#7c5cf0"); p.setAttribute("marker-end", "url(#ahp)"); }
  gPath.appendChild(p);
}
function label(x, y, text) {
  const d = document.createElement("div");
  d.className = "lbl"; d.style.left = x + "px"; d.style.top = y + "px"; d.textContent = text;
  canvas.appendChild(d);
}

/* ── 用户层 ── */
addBox(290, 100, 220, 52, "user", "二级账管员（建单/采购）");
addBox(660, 100, 220, 52, "user", "库管员（出库 / 入库）");
addBox(1030, 100, 220, 52, "user", "管理员 / 终端运营");

/* ── 前端层 ── */
addBox(240, 195, 520, 95, "fe",
  `<div class="bt">业务门户</div>
   <div class="bd">智能对话 · 富卡片流（SSE）　｜　补货建议双清单　｜　调拨工单 · 终端管理</div>`);
addBox(780, 195, 520, 95, "fe",
  `<div class="bt">数字员工运维台</div>
   <div class="bd">配置面：数字员工 / 技能 / 知识库 / 工具 / MCP　｜　Token 用量与配额　｜　调用审计</div>`);

/* ── 接入层 ── */
addBox(240, 330, 1060, 95, "biz",
  `<div class="bt">aismp-gateway 统一网关 　:8090</div>
   <div class="bd">Spring Cloud Gateway（WebFlux）</div>
   <div class="bd2">AK/SK 签名 + Bearer Token（MCP）双通道鉴权 ｜ IP 白名单 · nonce 防重放 ｜ 令牌桶限流 ｜ 响应装饰器计量（次数 / Token）</div>`);

/* ── 服务层 ── */
addBox(240, 470, 400, 190, "ai",
  `<div class="bt">agent-orchestrator 工作流编排服务 　:8125</div>
   <div class="bd">Python 3.12 · LangGraph · FastAPI</div>
   <div class="bd2">工作流：意图识别 → 取数 → 确定性算法<br>→ 调拨 / 采购双清单生成<br>critic 自纠回炉环 · supervisor 意图路由<br>SSE 事件流（start / progress / agent_step / result）<br>签名经网关回调 Java 智能体</div>`);
addBox(670, 470, 400, 190, "ai",
  `<div class="bt">aismp-agent 智能体服务 　:8124</div>
   <div class="bd">JDK 8 · Spring AI</div>
   <div class="bd2">ReAct 智能体（编排层可复用的执行体）<br>RAG 检索问答（操作手册知识库）<br>MCP Server（GET /sse + POST /mcp/message）<br>@Tool：查库存 / 查串码 / 知识库检索 / askAgent<br>调拨单创建 · Excel 串码解析校验</div>`);
addBox(1100, 470, 400, 190, "biz",
  `<div class="bt">aismp-backend 管理后端 　:7529</div>
   <div class="bd">Spring Boot 2.7 · MyBatis-Plus · Dubbo 3</div>
   <div class="bd2">管理后台（context-path /api）<br>Token / 调用计量账本（totalNum · leftNum 限额）<br>用户角色权限 · 会话认证（Redis）<br>Dubbo Provider：InnerUser / Interface / InvokeCount</div>`);

/* ── 中间件层（按主要消费方排位：PG 在 agent 正下、MySQL 在 backend 正下）── */
addBox(160, 740, 220, 64, "mw",
  `<div class="bt" style="font-size:13px;">Redis 　:6379</div>
   <div class="bd2">网关：nonce 防重放 · MCP token · 限流计数 · 会话</div>`);
addBox(440, 740, 220, 64, "mw",
  `<div class="bt" style="font-size:13px;">PostgreSQL 　:5432</div>
   <div class="bd2">terminal_kb：向量库 · 会话记忆（agent 读写）</div>`);
addBox(720, 740, 220, 64, "mw",
  `<div class="bt" style="font-size:13px;">Nacos 　:8848</div>
   <div class="bd2">Dubbo 注册中心（backend Provider ↔ gateway Consumer）</div>`);
addBox(1000, 740, 220, 64, "mw",
  `<div class="bt" style="font-size:13px;">MySQL 　:3306</div>
   <div class="bd2">api_db：业务数据 + 计量账本（backend 读写 · agent @Tool 查库存）</div>`);
addBox(1280, 740, 220, 64, "mw",
  `<div class="bt" style="font-size:13px;">RabbitMQ 　:5672</div>
   <div class="bd2">计量消息队列（gateway 发 → backend 消费落账）</div>`);

/* ── 外部服务 ── */
addBox(510, 860, 520, 70, "ext",
  `<div class="bt" style="font-size:13px;">智谱大模型（z.ai · OpenAI 兼容）</div>
   <div class="bd2">GLM 对话（编排层路由 / 重写 / 判分 · 智能体对话）　｜　embedding-3 向量化</div>`);

/* ── 连线（仅主干，全部短垂直 / 独立走廊，无交叉堆积）── */
arrow([[400,152],[400,195]]);
arrow([[770,152],[620,195]]);
arrow([[1140,152],[1140,195]]);
arrow([[500,290],[500,330]]); label(512,303,"HTTPS · REST + SSE");
arrow([[1040,290],[1040,330]]); label(1052,303,"HTTPS · REST");
arrow([[420,425],[420,470]]); label(262,441,"/orchestrator/**（SSE 路由）");
arrow([[470,470],[470,425]]); label(478,441,"签名回调调 agent");
arrow([[870,425],[870,470]]); label(880,441,"/oa/** · /sse · /mcp/**");
arrow([[1233,425],[1233,470]]); label(1241,441,"/api/** 管理");
/* gateway → Redis：左侧走廊（防重放 / 限流 / 会话） */
arrow([[240,378],[120,378],[120,772],[160,772]]);
const tr = document.createElementNS(NS, "text");
tr.setAttribute("transform", "rotate(-90 134 575)");
tr.setAttribute("x", 134); tr.setAttribute("y", 575);
tr.setAttribute("text-anchor", "middle"); tr.setAttribute("font-size", "12"); tr.setAttribute("fill", "#64748b");
tr.textContent = "防重放 · 限流 · 会话缓存";
document.getElementById("arrows").appendChild(tr);
/* agent → PostgreSQL（PG 已对位 agent 下方） */
arrow([[700,660],[700,706],[550,706],[550,740]]); label(388,709,"向量检索 / 会话记忆");
/* backend → MySQL：垂直短线 */
arrow([[1180,660],[1180,740]]); label(1192,676,"业务数据 · 计量账本");
/* backend → Nacos：Dubbo 注册 / 发现 */
arrow([[1130,660],[1130,712],[920,712],[920,740]]); label(935,690,"Dubbo 注册 / 发现");
/* 计量链：gateway → 右侧走廊 → RabbitMQ */
arrow([[1300,378],[1520,378],[1520,720],[1390,720],[1390,740]]); label(1390,698,"计量 / Token 消息");
/* RabbitMQ → backend：消费落账（垂直直线） */
arrow([[1330,740],[1330,660]]); label(1245,694,"消费落账");
/* LLM：agent → 智谱（虚线，指入顶边中央） */
arrow([[880,660],[880,820],[770,820],[770,860]], true, true);
label(755,700,"LLM 调用");
</script>
</body>
</html>
