# 公共配置文件
server:
  port: 8090

# 1.用户发送请求到API网关
spring:
  application:
    # 【必需】没有它日志只报 "No service to register for nacos client..."，
    # 网关自己不会注册到 Nacos（决策 #4 要求"全部注册"）
    name: aismp-gateway
  # redis 配置
  # ⚠️ 前缀必须是 spring.data.redis：SB3+ 起 spring.redis.* 已迁移，
  # 旧前缀在 SB4 被标记 deprecated=error，继续用会直接启动失败。
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # 本机 Redis 配了 requirepass；远端是 90-harden 生成的强密码（credentials.env 的 REDIS_PW）。
      # ⚠️ 冒号后的默认值【只服务本机开发】——远端必须由 compose environment 段注入覆盖。
      #    它是静默兜底：环境变量漏注入时不报错、直接用弱口令连库（最难发现的一类问题）。
      #    本机启动脚本 local-init/start-services.sh 已显式 export REDIS_PW，故此处默认值仅作保险。
      password: ${REDIS_PW:123456}
  rabbitmq:
    host: localhost
    port: 5672
    # 本机 guest/guest；远端 guest 已被删除（加固），用 aismp 账号（credentials.env）
    # ⚠️ 同上：默认值仅服务本机，远端必须注入 RABBIT_USER / RABBIT_PW
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PW:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          max-attempts: 3
          initial-interval: 1000
  cloud:
    # 服务注册与发现（Nacos 3.2.4）：鉴权链按服务名 lb://aismp-backend 调 backend
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: public
        register-enabled: true
        # 【必需】本机装了 VMware/WSL，存在虚拟网卡 192.168.150.1；
        # 不指定时 Nacos 会选中它作为注册 IP，导致同机其他服务按服务名调用时连不上。
        ip: 127.0.0.1
    gateway:
      # ⚠️ Gateway 5.0（Spring Cloud 2025.1.0）配置前缀已变：
      # 旧的 spring.cloud.gateway.routes / default-filters 不再被识别，
      # 必须放在 spring.cloud.gateway.server.webflux.* 下（否则路由全部丢失、直接 404）。
      server:
        webflux:
          # 全局默认过滤器：对所有路由生效
          default-filters:
            # 给所有响应添加响应头，key=source，value=aismp
            - AddResponseHeader=source, aismp
          # 路由配置列表（可配置多个）
          # 阶段4：能注册到 Nacos 的服务一律走 lb://（服务发现），未注册的（Python 编排、Mock）保持静态 uri
          routes:
            # 【终端业务】阶段1 已从 backend 迁到 aismp-agent（业务实现在 agent，见决策 #1）。
            # agent 的真实路径是 /terminal/**、/transferOrder/**（无 /api 前缀），
            # 所以这里 StripPrefix=1 把网关侧的 /api/xxx 剥掉一层。
            # 必须声明在下方 api_route(/api/**) 之前 —— Spring Cloud Gateway 按声明顺序匹配，
            # 否则 /api/terminal/** 会被 api_route 抢走转发到 8123（Mock 服务），报 404。
            # interface_info 登记见 local-init/72-terminal-route-registry.sql。
            - id: terminal_biz_route
              uri: lb://aismp-agent
              predicates:
                - Path=/api/terminal/**,/api/transferOrder/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"
            # 编排服务路由（M3：LangGraph 编排层）
            # 保持静态 uri：orchestrator 是 Python 服务，不注册 Nacos
            - id: orchestrator_route
              # 2026-10-10 容器化修复：原来写死 http://localhost:8125，
              # 容器里 localhost 指向网关自己 → 编排层门户通道全部 500。
              # 改为可注入，默认值保持 localhost（原生部署不变），容器里由 compose 注入 orchestrator:8125。
              uri: ${ORCHESTRATOR_URI:http://localhost:8125}
              predicates:
                - Path=/orchestrator/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
            # 【编排层·门户通道】2026-10-07：门户「智能路由」对话与「扫描本仓」经此进编排层。
            # StripPrefix=1 把 /api/orchestrator/** 还原成编排层真实路径 /orchestrator/**。
            # ⚠️ 必须声明在 api_route(/api/**) 之前 —— Spring Cloud Gateway 按声明顺序匹配。
            # 认证：门户 Bearer 令牌（同 /api/terminal 等业务接口），见 CustomGlobalFilter
            # 的 isPortalPath 列表；interface_info 登记见 local-init/79-orchestrator-portal-registry.sql。
            - id: orchestrator_portal_route
              uri: ${ORCHESTRATOR_URI:http://localhost:8125}
              predicates:
                - Path=/api/orchestrator/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
            # 【平台账本路由】2026-10-06 批 A：登录令牌签发与 token 配额从内核迁至 backend。
            # /api/auth/**（登录握手）、/api/admin/token/**（配额管理）→ lb://aismp-backend。
            # ⚠️ 必须声明在 digital_human_portal_route 之前（Gateway 按声明顺序匹配，
            #    否则 /api/admin/token/** 会被 /api/admin/** 抢到内核）；
            # ⚠️ 不 StripPrefix —— backend context-path 是 /api，原样转发即命中 /api/auth/login。
            - id: portal_backend_auth_route
              uri: lb://aismp-backend
              predicates:
                - Path=/api/auth/**,/api/admin/token/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userKeyResolver}"
            # 【门户通道】门户静态页（public/portal.html + 构建出的 portal.js）与管理台（5174 dev / nginx /admin/）的 /api 经此进内核，
            # 不再直连 8126 —— 收敛后门户流量同样吃网关的鉴权/限流/计量。
            # 认证方式见 CustomGlobalFilter 的"三协议通道"：Bearer → Redis(portal:token:) → ak；
            # /api/auth/** 是登录握手（匿名放行，登录成功时网关登记令牌映射）。
            # interface_info 登记见 local-init/74-portal-route-registry.sql。
            - id: digital_human_portal_route
              uri: lb://aismp-digital-human
              predicates:
                - Path=/api/agent/**,/api/admin/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userKeyResolver}"
            # 【数字员工内核】Spring Boot 4 + Spring AI 2.0 + SAA（已注册 Nacos → lb://）
            # 用 /digitalHuman 前缀 + StripPrefix=1：把 /digitalHuman/agent/** 还原成后端真实的 /agent/**。
            # 注意鉴权过滤器 getOrder()=-1，先于 StripPrefix 执行，所以 interface_info 里登记的是
            # **带前缀的网关侧路径**（/digitalHuman/...），不是后端路径。
            - id: digital_human_route
              uri: lb://aismp-digital-human
              predicates:
                - Path=/digitalHuman/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
            # 路由唯一标识，自定义命名即可
            # 保持静态 uri：aismp-interface 是本地 Mock 服务，未注册 Nacos
            - id: api_route
              # 目标服务地址：请求转发到本地8123端口
              uri: http://localhost:8123
              # 断言（路由匹配规则）
              predicates:
                # 路径匹配规则：所有以 /api/ 开头的请求都会被此路由拦截并转发
                - Path=/api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
            # Agent 接口路由（RAG / MCP，已注册 Nacos → lb://）
            - id: agent_route
              uri: lb://aismp-agent
              predicates:
                - Path=/oa/**,/sse,/mcp/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
#            - id: add_request_header_route
#              uri: http://localhost:8123
#              predicates:
#                - Path=/api/**
#              filters:
#                - AddRequestHeader=aismp, swag
#                - AddRequestParameter=name, dog
#                - name: CircuitBreaker
#                  args:
#                    name: myCircuitBreaker
#                    fallbackUri: forward:/fallback
#            - id: aismp-fallback
#              predicates:
#                - Path=/fallback
# 门户（自有前端）的令牌在平台账本里挂到哪个 ak 名下。
# 浏览器不可能持有 AK/SK（那是第三方开发者的长期凭证），门户登录成功后网关会把
# portal:token:<token> → 这个 ak 写进 Redis（见 CustomGlobalFilter.handlePortalAuth）。
aismp:
  portal:
    access-key: ${PORTAL_AK:aismp-console}

logging:
  level:
    org:
      springframework:
        cloud:
          gateway: trace