spring:
  application:
    name: aismp-backend
  # 服务注册与发现（Nacos 3.2.4，主端口 8848）
  # 网关用 lb://aismp-backend 按服务名找到本服务（见网关 CustomGlobalFilter）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: public
        register-enabled: true
        # 【必需】本机装了 VMware/WSL，存在虚拟网卡 192.168.150.1；
        # 不指定时 Nacos 会选中它作为注册 IP，导致同机其他服务按服务名调用时连不上。
        ip: 127.0.0.1
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/api_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 应用用最小权限账号连接，只授权 api_db（root 已被收回 localhost）
    username: ${MYSQL_APP_USER:api_user}
    password: ${MYSQL_APP_PW:}
  # 原 spring.mvc.pathmatch.matching-strategy: ANT_PATH_MATCHER 已删除 ——
  # 那是给 springfox/knife4j 用的，阶段3 已随 knife4j 移除，SB3+ 默认 PATH_PATTERN_PARSER 即可。
  # session 失效时间（分钟）
  session:
    timeout: 86400
    store-type: none
  # redis 配置
  # ⚠️ 前缀必须是 spring.data.redis：SB3+ 起 spring.redis.* 已迁移，
  # 旧前缀在 SB4 被标记 deprecated=error，继续用会直接启动失败。
  data:
    redis:
      port: 6379
      host: localhost
      database: 0
      # Redis 已设 requirepass（无密码的 Redis 正是上次被写入后门的原因），密码走环境变量
      password: ${REDIS_PW:}
  # rabbitmq 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USER:aismp}
    password: ${RABBIT_PW:}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          max-attempts: 3
          initial-interval: 1000
server:
  port: 7529
  servlet:
    context-path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)


aismp:
  client:
    access-key:  aismp-console
    secret-key:  7c1f9a3e5d0b2846af31c7e9b0d45268
  # 管理端代理出口：backend → 网关。
  # AK/SK 只存在于服务端（上面 client 那对），绝不下发到浏览器 ——
  # 管理端前端带的是登录态（session），由 @AuthCheck 校验 admin 角色。
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://127.0.0.1:8090}
    # 数字员工管理接口在网关侧的前缀（登记见 local-init/61-digital-human-interface-registry.sql）
    digital-human-prefix: ${DIGITAL_HUMAN_GW_PREFIX:/digitalHuman/admin}
  # 数字员工内核直连地址：仅用于服务账号（svc_orchestrator）登录 /auth/login 换 Bearer 令牌，
  # 业务请求仍走网关。登录接口是匿名的、且网关只放行登记过的路径，所以登录必须直连。
  digital-human:
    base-url: ${DIGITAL_HUMAN_BASE_URL:http://127.0.0.1:8126}

